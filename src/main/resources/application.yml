server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: lax
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nobre}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
app:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-this-32-chars}
  frontend-url: ${FRONTEND_URL:http://localhost:3000,http://127.0.0.1:3000}
  admin-email: ${ADMIN_EMAIL:admin@nobre.local}
  cookie-secure: ${COOKIE_SECURE:false}
  cookie-same-site: ${COOKIE_SAME_SITE:Lax}
